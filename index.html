<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reseller Profit Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="badge">● CALCULATOR STATUS: READY</div>

  <h1>Know Your Margin.<br><span class="gradient-text">Before You List It.</span></h1>

  <div class="card">
    <label for="itemName">Item Name</label>
    <input type="text" id="itemName" placeholder="e.g. Vintage Jacket">

    <label for="currency">Currency</label>
    <select id="currency">
      <option value="USD">USD ($)</option>
      <option value="CNY">CNY (¥)</option>
    </select>

    <label for="cost">Total Base Cost (<span class="currency-symbol">¥</span>)</label>
    <input type="number" id="cost" step="any" placeholder="e.g. 500">

    <label for="sell">Selling Price per Item ($)</label>
    <input type="number" id="sell" step="any" placeholder="e.g. 25">

    <label for="qty">Quantity</label>
    <input type="number" id="qty" step="any" placeholder="e.g. 1">

    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" step="any" placeholder="e.g. 2">

    <label for="rate">Shipping Rate (<span class="currency-symbol">$</span> per kg)</label>
    <input type="number" id="rate" step="any" placeholder="e.g. 5">

    <label for="platformFee">Platform Fee (%)</label>
    <input type="number" id="platformFee" step="any" placeholder="e.g. 10">

    <label for="platformFlatFee">Platform Flat Fee ($ per sale)</label>
    <input type="number" id="platformFlatFee" step="any" value="0.45">

    <label for="customs">Customs/Import Tax (<span class="currency-symbol">$</span> flat)</label>
    <input type="number" id="customs" step="any" placeholder="e.g. 20">

    <button id="calcBtn">Add Item</button>

    <div class="edit-bar" id="editBar">
      <button type="button" id="editBtn">Make Changes</button>
      <button type="button" id="saveChangesBtn">Save Changes</button>
      <button type="button" id="cancelEditBtn">Cancel</button>
      <button type="button" id="newItemBtn">+ New Item</button>
    </div>

    <div class="terminal">
      <div class="terminal-header">
        <span></span><span></span><span></span>
        <span class="terminal-title">profit@calc — zsh</span>
      </div>
      <div class="terminal-body">
        <div>$ run calculate-profit</div>
        <div id="result" class="terminal-result">&gt; awaiting input...</div>
      </div>
    </div>

    <div class="items-list">
      <table id="itemsTable">
        <thead>
          <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Profit</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="itemsTableBody"></tbody>
      </table>
    </div>

    <div class="grand-total">
      Grand Total: <span id="grandTotal">$0.00</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
